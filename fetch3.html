<!DOCTYPE html>
<html lang="en">
<head>
    <style>
      .cards{
            width:300px;
            height:500px;
            box-shadow:0px 5px 10px rgba(0,0,0,0.5);
            margin:10px;
            transition:all ease 0.5s;
            border-radius: 5px;
        }

        .cards:hover{
            transform:translateY(-10px);
            transition:all ease 0.5s;
        }

        .cards img{
            width:inherit;
            height:200px;
            object-fit:contain;
        }

        body{
            padding:20px;
            display:grid;
            grid-template-columns:1fr 1fr 1fr 1fr;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

        }

        .card-body{

            padding:20px;
        }

        button{
            border:none;
            background:red;
            color:white;
            padding:10px 20px;
            margin-top:10px;
            font-size:20px;
            box-shadow:2px 2px 2px 2px black;
            border-radius:5px;

        }

        .offer{
            background:green;
            display:block;
            color:white;
            padding:5px 10px;
            width:30px;
            margin:5px;
            border-radius:5px;
        }
    </style>
</head>
<body>
<script>
 async function loadproducts(){
    try{
        let response=await fetch("https://dummyjson.com/products");
        let products=await response.json();
        console.log(products.products);
        let cards="";

        products.products.map((p)=>{
            document.body.innerHTML+=`
                <div class="cards">
                    <img src=${p.thumbnail}>
                    <div class="card-body">
                        <dt><b>Title</b></dt>
                        <dd>${p.title.slice(0,40)}</dd>

                        <dt><b>price</b></dt>
                        <dd>&#8377;${p.price}</dd>

                        <dt><b>Rating</b></dt>
                        <dd><span class="offer">${p.rating}</span></dd>

                        <button>Add to cart</button>
                
                    </div>
                </div>

                `
            

            })
        }
        catch(error)
        {
          console.log(error)
        }   

    }
loadproducts();
    </script>
</body>
</html>
