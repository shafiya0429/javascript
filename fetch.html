<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    body{
        margin:50px;
        font-family: 'Times New Roman', Times, serif;
    }
    table{
        box-shadow: 2px 2px 2px black;
        margin:1opx auto;
        border-collapse: collapse;
        border-radius: 5px;
    }
    thead{
        color: aquamarine;
        background-color: rgb(209, 6, 6);
    }
    th,td{
        padding: 10px;
    }
    table.th,td{
        border-bottom: 1px solid gray;
        
    }
    tbody tr:nth-child(even){
        background: lightpink;
    }
    tbody tr:nth-child(odd){
        background: lightseagreen;
    }
    tbody tr:hover{
        transition: all 1s;
        background-color: lightgoldenrodyellow;
        color: blue;
    }
  </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>username</th>
                <th>Email</th>
                <th>Street</th>
                <th>Phone</th>
            </tr>
        </thead>
        <tbody id="hello">

        </tbody>
    </table>
    <script>
        function loadusers(){
            fetch("https://jsonplaceholder.typicode.com/users")
            .then((response)=>response.json())
            .then((users)=>{
                console.log(users);
                users.map((user)=>{
                    document.getElementById("hello").innerHTML+=`
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.username}</td>
                        <td>${user.email}</td>
                        <td>${user.address.street}</td>
                        <td>${user.phone}</td>
                    </tr>
                    `
                })
            })
            .catch((error)=>console.log(error))
        }
        loadusers();
    </script>
</body>
</html>
