<!DOCTYPE html>
<html>
<head>

<style>

.card{
    width:300px;
    height: 500px;
    box-shadow: 0px 5px 10px rgba(0,0,0,0.5);
    margin: 10px;
    transition: all ease 0.5s;
}

.card:hover{
    transform: translateY(-10px);
    transition: all ease 0.5s;
}
.card img{

    width: inherit;
    height: 200px;
    object-fit: contain;
    
}

body{
padding: 20px;
display: grid;
grid-template-columns:1fr 1fr 1fr 1fr;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;


}
.card-body{
    padding:10px;
}

button{
    border: none;
    background: red;
color:white;
padding: 10px 20px;
margin-top: 10px;
font-size: 18px;
box-shadow: 2px 2px 2px black;
border-radius: 4px;
}
.offer{
    background: green;
    display: block;
    color:white;
    padding: 5px 10px;
    width: 30px;
    margin: 5px;
    border-radius: 5px;
}
</style>

</head>
<body>

<script>

async function loadProducts()
{


    try{

    let response=await fetch("https://fakestoreapi.com/products");
    let products=await response.json();
    console.log(products);


    products.map((p)=>{

        document.body.innerHTML +=`
     
            <div class="card">
                <img src=${p.image}>
                <div class="card-body">
                    <dt><b>Title</b></dt>
                    <dd>${p.title.slice(0,40)}</dd>

                    <dt><b>Price</b></dt>
                    <dd>&#8377;${p.price}</dd>

                      <dt><b>Rating</b></dt>
                    <dd><span class="offer">${p.rating.rate}</span> </dd>
                    <button>Add To Cart</button>
                </div>
            </div>
   
             
        
        `

    })


    }

    catch(error)
    {
        console.log(error)
    }
   

}

loadProducts();


</script>

    
</body>
</html>
